# macOS paketini (.dmg) GitHub'ın macOS sunucusunda derler ve sürüme ekler.
# - "v…" etiketi gönderildiğinde otomatik çalışır.
# - Actions sekmesinden elle de çalıştırılabilir (var olan bir sürüme eklemek için etiketi yazın).
name: macOS paketi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "DMG'nin ekleneceği sürüm etiketi (ör. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (M1 ve sonrası)
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pikepdf'in (img2pdf bağımlılığı) Intel Mac için hazır paketi yok; kaynaktan derlemek için qpdf gerekir
      - name: qpdf kur (Intel)
        if: matrix.arch == 'x86_64'
        run: |
          brew install qpdf
          echo "CPATH=$(brew --prefix qpdf)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix qpdf)/lib" >> "$GITHUB_ENV"

      - name: Duman testi
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -q -r requirements.txt
          python tests/smoke_test.py

      - name: Uygulamayı derle
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Derlenen uygulama açılıyor mu?
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP_BIN="dist/UYAP TIFF Görüntüleyici.app/Contents/MacOS/UyapTifViewer"
          "$APP_BIN" samples/uyap_ornek.tif > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Uygulama başlatıldıktan sonra kapandı:"; cat app.log; exit 1
          fi
          kill "$PID"
          echo "Uygulama 20 saniye boyunca sorunsuz çalıştı."

      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG="dist/UyapTifViewer-macOS-${{ matrix.arch }}.dmg"
          mv dist/UyapTifViewer.dmg "$DMG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "UYAP TIFF Görüntüleyici ${TAG#v}" --generate-notes
          gh release upload "$TAG" "$DMG" --clobber
